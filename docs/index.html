<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI & Claude Resources</title>
<meta name="description" content="A curated list of useful AI tools, Claude Code resources, agent frameworks, and related projects." />
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e3e3e6;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --accent: #6366f1;
    --accent-bg: #eef0fe;
    --chip-bg: #f0f0f3;
    --chip-active-bg: #6366f1;
    --chip-active-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --surface: #201f24;
      --border: #33333a;
      --text: #eceef0;
      --text-dim: #9a9aa2;
      --accent: #8b8cf9;
      --accent-bg: #2a2a4a;
      --chip-bg: #2b2b30;
      --chip-active-bg: #8b8cf9;
      --chip-active-text: #17171a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --surface: #201f24; --border: #33333a; --text: #eceef0;
    --text-dim: #9a9aa2; --accent: #8b8cf9; --accent-bg: #2a2a4a;
    --chip-bg: #2b2b30; --chip-active-bg: #8b8cf9; --chip-active-text: #17171a;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e3e3e6; --text: #1c1c1f;
    --text-dim: #6b6b74; --accent: #6366f1; --accent-bg: #eef0fe;
    --chip-bg: #f0f0f3; --chip-active-bg: #6366f1; --chip-active-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  html, body { height: 100%; }
  .layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    align-items: start;
    width: 100%;
    min-height: 100vh;
  }
  aside.sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .sidebar-header {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1rem 1.1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .sidebar-header .sidebar-title { margin: 0; }
  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.25rem 1rem 1.5rem;
  }
  .content-col {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 1.75rem 2rem 1.25rem;
  }
  .header-inner { max-width: 900px; margin: 0 auto; text-align: center; }
  .header-row { display: flex; align-items: flex-start; gap: 0.75rem; }
  .header-text { flex: 1; min-width: 0; }
  #filters-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 40px;
    height: 40px;
    padding: 0;
    cursor: pointer;
  }
  #filters-toggle svg { width: 20px; height: 20px; }
  #filters-toggle .active-count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    font-size: 0.65rem;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    padding: 0 3px;
    display: none;
  }
  #filters-toggle .active-count.show { display: inline-block; }
  .sidebar-close {
    display: none;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.2rem;
  }
  .sidebar-close:hover { color: var(--text); }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 0.35rem;
    letter-spacing: -0.02em;
  }
  .subtitle { color: var(--text-dim); margin: 0 0 1.1rem; font-size: 0.95rem; }
  #search {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 0.7rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sidebar-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 1.2rem;
    letter-spacing: -0.01em;
  }
  .filter-group { margin-bottom: 1.4rem; }
  .filter-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    display: block;
    margin-bottom: 0.5rem;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .sidebar .chips { flex-direction: column; align-items: stretch; gap: 0.2rem; }
  .chip {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    padding: 0.32rem 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
    white-space: nowrap;
    text-align: left;
    width: 100%;
    border-radius: 7px;
  }
  .chip:hover { background: var(--chip-bg); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip .indicator {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .chip-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .chip-count {
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 0.72rem;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  .chip.active .chip-count { color: inherit; opacity: 0.75; }
  /* Category chips = radio buttons (single-select) */
  .chip.chip-radio .indicator {
    border-radius: 50%;
    border: 1.5px solid var(--text-dim);
  }
  .chip.chip-radio.active .indicator {
    border-color: var(--accent);
  }
  .chip.chip-radio.active .indicator::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .chip.chip-radio.active { color: var(--accent); font-weight: 600; }
  /* Tag chips = checkboxes (multi-select) */
  .chip.chip-checkbox .indicator {
    border-radius: 4px;
    border: 1.5px solid var(--text-dim);
  }
  .chip.chip-checkbox.active .indicator {
    background: var(--accent);
    border-color: var(--accent);
  }
  .chip.chip-checkbox.active .indicator svg { display: block; }
  .chip.chip-checkbox .indicator svg { display: none; width: 10px; height: 10px; }
  .chip.chip-checkbox.active { color: var(--accent); font-weight: 600; }
  .meta-row {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-dim);
    font-size: 0.82rem;
    padding: 0.8rem 1.25rem 0.8rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #clear-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.82rem;
    padding: 0;
  }
  main { max-width: 900px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem 0; }
  .category { margin-top: 2rem; }
  .category:first-child { margin-top: 0; }
  .sidebar-overlay {
    display: none;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    #filters-toggle { display: flex; order: 2; }
    .sidebar-close { display: block; }
    .header-inner { text-align: left; }
    .header-text { text-align: left; order: 1; }
    #search { margin: 0; max-width: none; }
    aside.sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      width: min(320px, 85vw);
      z-index: 200;
      background: var(--bg);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.18);
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }
    aside.sidebar.open { transform: translateX(0); }
    aside.sidebar { border-right: none; border-left: 1px solid var(--border); }
    .sidebar-overlay {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
      z-index: 190;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  }
  .category h2 {
    font-size: 1.05rem;
    margin: 0 0 0.8rem;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.75rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .card:hover { border-color: var(--accent); }
  .card .name {
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .card:hover .name { color: var(--accent); }
  .card .desc { color: var(--text-dim); font-size: 0.85rem; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.15rem; }
  .tag-pill {
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 0.68rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-weight: 500;
  }
  #empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 3rem 1rem;
    display: none;
  }
  footer {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
    z-index: 90;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(480px, 100%);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 100;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .panel.open { transform: translateX(0); }
  .panel-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    float: right;
    padding: 0.2rem;
  }
  .panel-close:hover { color: var(--text); }
  .panel h2 {
    font-size: 1.3rem;
    margin: 0.2rem 0 0.6rem;
    letter-spacing: -0.01em;
  }
  .panel .panel-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 1.1rem; }
  .panel-section { margin-bottom: 1.2rem; }
  .panel-section h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 0.4rem;
  }
  .panel-section p { margin: 0; font-size: 0.92rem; }
  .panel-section ol { margin: 0; padding-left: 1.2rem; font-size: 0.9rem; }
  .panel-section ol li { margin-bottom: 0.35rem; }
  .panel-visit {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-top: 0.4rem;
  }
  .panel-no-install {
    color: var(--text-dim);
    font-size: 0.9rem;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-title">Filters</p>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close filters">&times;</button>
    </div>
    <div class="sidebar-scroll">
      <div class="filter-group">
        <span class="filter-label">Category</span>
        <div class="chips" id="category-chips" role="radiogroup" aria-label="Filter by category"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Tags</span>
        <div class="chips" id="tag-chips" role="group" aria-label="Filter by tag"></div>
      </div>
    </div>
    <div class="meta-row">
      <span id="result-count"></span>
      <button id="clear-btn">Clear</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="content-col">
    <header>
      <div class="header-inner">
        <div class="header-row">
          <div class="header-text">
            <h1>AI &amp; Claude Resources</h1>
            <p class="subtitle">A curated list of useful AI tools, Claude Code resources, agent frameworks, and related projects.</p>
          </div>
          <button id="filters-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Show filters">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="active-count" id="active-count">0</span>
          </button>
        </div>
        <input id="search" type="text" placeholder="Search by name or description..." />
      </div>
    </header>

    <main id="results"></main>
    <div id="empty-state">No resources match your filters.</div>

    <footer>
      <span id="tag-note"></span>
      &middot; Source: <a href="https://github.com/shresthasans/ai-tools-and-resources/blob/main/README.md">README.md</a>
    </footer>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <button class="panel-close" id="panel-close" aria-label="Close">&times;</button>
  <div id="panel-body"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const data = window.RESOURCE_DATA;
  const state = { search: '', category: null, tags: new Set() };

  const categoryChips = document.getElementById('category-chips');
  const tagChips = document.getElementById('tag-chips');
  const resultsEl = document.getElementById('results');
  const emptyState = document.getElementById('empty-state');
  const resultCount = document.getElementById('result-count');
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clear-btn');
  document.getElementById('tag-note').textContent = data.generatedNote || '';

  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  const panelClose = document.getElementById('panel-close');

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function openPanel(entry) {
    const d = entry.details;
    let html = '';
    html += '<h2>' + escapeHtml(entry.name) + '</h2>';
    html += '<div class="panel-tags">' + entry.tags.map(t => '<span class="tag-pill">' + escapeHtml(t) + '</span>').join('') + '</div>';

    html += '<div class="panel-section"><h3>What it is</h3><p>' + escapeHtml(d ? d.whatItIs : entry.desc) + '</p></div>';

    if (d && d.whyHelpful) {
      html += '<div class="panel-section"><h3>Why it helps</h3><p>' + escapeHtml(d.whyHelpful) + '</p></div>';
    }

    html += '<div class="panel-section"><h3>Getting started</h3>';
    if (d && d.installNeeded && d.install && d.install.length > 0) {
      html += '<ol>' + d.install.map(step => '<li>' + escapeHtml(step) + '</li>').join('') + '</ol>';
    } else {
      html += '<p class="panel-no-install">No install needed — just open the link below.</p>';
    }
    html += '</div>';

    html += '<a class="panel-visit" href="' + entry.url + '" target="_blank" rel="noopener noreferrer">Visit →</a>';

    panelBody.innerHTML = html;
    panel.classList.add('open');
    overlay.classList.add('open');
  }

  function closePanel() {
    panel.classList.remove('open');
    overlay.classList.remove('open');
  }

  overlay.addEventListener('click', closePanel);
  panelClose.addEventListener('click', closePanel);

  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const sidebarClose = document.getElementById('sidebar-close');
  const filtersToggle = document.getElementById('filters-toggle');
  const activeCountBadge = document.getElementById('active-count');

  function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
    filtersToggle.setAttribute('aria-expanded', 'true');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
    filtersToggle.setAttribute('aria-expanded', 'false');
  }

  filtersToggle.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  sidebarOverlay.addEventListener('click', closeSidebar);
  sidebarClose.addEventListener('click', closeSidebar);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closePanel();
      closeSidebar();
    }
  });

  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function makeChip(label, count, isActive, variant, onClick) {
    const el = document.createElement('button');
    el.className = 'chip chip-' + variant + (isActive ? ' active' : '');
    el.type = 'button';
    if (variant === 'radio') {
      el.setAttribute('role', 'radio');
      el.setAttribute('aria-checked', String(isActive));
    } else {
      el.setAttribute('role', 'checkbox');
      el.setAttribute('aria-checked', String(isActive));
    }
    const indicator = document.createElement('span');
    indicator.className = 'indicator';
    if (variant === 'checkbox') indicator.innerHTML = CHECK_SVG;
    const text = document.createElement('span');
    text.className = 'chip-label';
    text.textContent = label;
    const count_ = document.createElement('span');
    count_.className = 'chip-count';
    count_.textContent = count;
    el.appendChild(indicator);
    el.appendChild(text);
    el.appendChild(count_);
    el.addEventListener('click', onClick);
    return el;
  }

  const allEntries = data.categories.flatMap(c => c.entries);
  const tagCounts = {};
  data.allTags.forEach(tag => {
    tagCounts[tag] = allEntries.filter(e => e.tags.includes(tag)).length;
  });

  function renderChips() {
    categoryChips.innerHTML = '';
    categoryChips.appendChild(makeChip('All', allEntries.length, state.category === null, 'radio', () => {
      state.category = null;
      renderAll();
    }));
    data.categories.forEach(cat => {
      categoryChips.appendChild(makeChip(cat.name, cat.entries.length, state.category === cat.name, 'radio', () => {
        state.category = state.category === cat.name ? null : cat.name;
        renderAll();
      }));
    });

    tagChips.innerHTML = '';
    data.allTags.forEach(tag => {
      tagChips.appendChild(makeChip(tag, tagCounts[tag], state.tags.has(tag), 'checkbox', () => {
        if (state.tags.has(tag)) state.tags.delete(tag);
        else state.tags.add(tag);
        renderAll();
      }));
    });
  }

  function matches(entry) {
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = (entry.name + ' ' + entry.desc).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.tags.size > 0) {
      for (const t of state.tags) {
        if (!entry.tags.includes(t)) return false;
      }
    }
    return true;
  }

  function renderResults() {
    resultsEl.innerHTML = '';
    let total = 0;
    const cats = state.category
      ? data.categories.filter(c => c.name === state.category)
      : data.categories;

    cats.forEach(cat => {
      const entries = cat.entries.filter(matches);
      if (entries.length === 0) return;
      total += entries.length;

      const section = document.createElement('section');
      section.className = 'category';
      const h2 = document.createElement('h2');
      h2.textContent = cat.name + ' (' + entries.length + ')';
      section.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'grid';
      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'card';
        card.addEventListener('click', () => openPanel(entry));
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = entry.name;
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = entry.desc;
        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'tags';
        entry.tags.forEach(t => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill';
          pill.textContent = t;
          tagsWrap.appendChild(pill);
        });
        card.appendChild(name);
        card.appendChild(desc);
        card.appendChild(tagsWrap);
        grid.appendChild(card);
      });
      section.appendChild(grid);
      resultsEl.appendChild(section);
    });

    resultCount.textContent = total + ' resource' + (total === 1 ? '' : 's');
    emptyState.style.display = total === 0 ? 'block' : 'none';
  }

  function renderAll() {
    renderChips();
    renderResults();
    const activeCount = (state.category ? 1 : 0) + state.tags.size;
    activeCountBadge.textContent = activeCount;
    activeCountBadge.classList.toggle('show', activeCount > 0);
  }

  searchInput.addEventListener('input', e => {
    state.search = e.target.value;
    renderResults();
  });

  clearBtn.addEventListener('click', () => {
    state.search = '';
    state.category = null;
    state.tags.clear();
    searchInput.value = '';
    renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
